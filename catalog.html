<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Findest Sport — Catalog</title>
<meta name="theme-color" content="#0D9488">
<meta name="description" content="Distributor suplemen premium ON, BSN, ISOPURE — Bali. Order langsung via QR outlet.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="icon" type="image/svg+xml" href="icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Findest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --white:#FFFFFF;--bg:#F7F7F8;--surface:#FFFFFF;--surface2:#F1F1F3;--surface3:#E8E8EC;
  --border:rgba(0,0,0,.06);--border2:rgba(0,0,0,.10);--border3:rgba(0,0,0,.15);
  --text:#111111;--text2:#333333;--muted:#6B7280;--subtle:#9CA3AF;
  --accent:#111111;--accent-light:rgba(17,17,17,.06);
  --teal:#0D9488;--teal-light:rgba(13,148,136,.08);--teal-border:rgba(13,148,136,.2);
  --green:#059669;--green-light:rgba(5,150,105,.08);
  --red:#DC2626;--red-light:rgba(220,38,38,.06);
  --amber:#D97706;--amber-light:rgba(217,119,6,.06);
  --blue:#2563EB;--blue-light:rgba(37,99,235,.06);
  --on-color:#0D9488;--bsn-color:#2563EB;--iso-color:#DB2777;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.04);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,.08),0 8px 10px -6px rgba(0,0,0,.04);
  --radius:12px;--radius-lg:16px;--radius-xl:20px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ══════ CUSTOMER BANNER (QR authed) ══════ */
.cust-banner{background:linear-gradient(135deg,#0D9488,#0F766E);color:var(--white);padding:10px 20px;display:none;align-items:center;gap:10px;font-size:13px;font-weight:500}
.cust-banner.show{display:flex}
.cust-banner svg{width:16px;height:16px;flex-shrink:0;fill:var(--white);opacity:.9}
.cust-banner-name{font-weight:700;letter-spacing:-.1px}
.cust-banner-sub{opacity:.85;font-size:12px;font-weight:400}
.cust-banner-orders{margin-left:auto;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);color:var(--white);padding:5px 12px;border-radius:100px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);letter-spacing:.2px}
.cust-banner-orders:hover{background:rgba(255,255,255,.25)}
@media(max-width:640px){
  .cust-banner{font-size:12px;padding:8px 16px;gap:8px}
  .cust-banner-sub{display:none}
}

/* ══════ NAVBAR ══════ */
.navbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--border);padding:0 20px}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;height:56px;gap:16px}
.nav-brand{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.nav-logo{width:32px;height:32px;background:var(--text);color:var(--white);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:.5px}
.nav-name{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.nav-search{flex:1;max-width:420px;position:relative}
.nav-search input{width:100%;height:38px;border:1px solid var(--border2);border-radius:10px;padding:0 14px 0 38px;font-size:14px;font-family:var(--font);color:var(--text);background:var(--bg);outline:none;transition:all .2s}
.nav-search input:focus{border-color:var(--border3);background:var(--white);box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.nav-search input::placeholder{color:var(--subtle)}
.nav-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--subtle);pointer-events:none}
.nav-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--subtle);cursor:pointer;font-size:13px;display:none;padding:2px 4px}
.nav-cart{position:relative;background:none;border:none;cursor:pointer;padding:8px;border-radius:10px;transition:background .15s;display:flex;align-items:center;justify-content:center}
.nav-cart:hover{background:var(--surface2)}
.nav-cart svg{width:22px;height:22px;stroke:var(--text);fill:none}
.nav-cart-badge{position:absolute;top:2px;right:2px;background:var(--teal);color:var(--white);width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid var(--white)}
.nav-cart-badge.show{display:flex}

/* ══════ HERO ══════ */
.hero{background:var(--white);border-bottom:1px solid var(--border);overflow:hidden}
.hero-inner{max-width:1200px;margin:0 auto;padding:48px 24px 44px;position:relative}
.hero-label{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--teal-light);border:1px solid var(--teal-border);border-radius:100px;font-size:12px;font-weight:600;color:var(--teal);margin-bottom:24px}
.hero-label svg{width:14px;height:14px;fill:var(--teal)}
.hero-title{font-size:clamp(36px,8vw,64px);font-weight:900;line-height:1;letter-spacing:-2.5px;color:var(--text);margin-bottom:16px}
.hero-title span{color:var(--teal)}
.hero-desc{font-size:16px;line-height:1.6;color:var(--muted);max-width:420px;margin-bottom:28px}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px}
.hero-chip{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:13px;font-weight:500;color:var(--text2)}
.hero-chip svg{width:16px;height:16px;flex-shrink:0}
.hero-deco{position:absolute;right:-20px;top:50%;transform:translateY(-50%);width:340px;height:340px;border-radius:50%;background:linear-gradient(135deg,rgba(13,148,136,.06),rgba(37,99,235,.04));pointer-events:none}
@media(max-width:640px){.hero-deco{display:none}}

/* ══════ GSAP INITIAL STATES ══════ */
.hero-label,.hero-title,.hero-desc,.hero-chips{opacity:0}
.stat-item{opacity:0}
.section-head{opacity:0}

/* ══════ NAVBAR SCROLL EFFECT ══════ */
.navbar{transition:box-shadow .3s,background .3s}
.navbar.scrolled{box-shadow:0 4px 20px rgba(0,0,0,.06);background:rgba(255,255,255,.95)}

/* ══════ FILTER ACTIVE TRANSITION ══════ */
.filter-btn{transition:all .25s cubic-bezier(.16,1,.3,1)}
.filter-btn:active{transform:scale(.92)}

/* ══════ STATS ══════ */
.stats{background:var(--white);border-bottom:1px solid var(--border)}
.stats-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding:0 24px}
.stat-item{padding:20px 0;text-align:center;position:relative}
.stat-item:not(:last-child)::after{content:'';position:absolute;right:0;top:25%;height:50%;width:1px;background:var(--border)}
.stat-num{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-1px}
.stat-label{font-size:11px;font-weight:500;color:var(--subtle);text-transform:uppercase;letter-spacing:.8px;margin-top:4px}

/* ══════ FILTERS ══════ */
.filters{position:sticky;top:56px;z-index:90;background:rgba(247,247,248,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.filters-inner{max-width:1200px;margin:0 auto;display:flex;gap:6px;padding:12px 24px;overflow-x:auto;scrollbar-width:none}
.filters-inner::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;padding:7px 16px;border-radius:100px;border:1px solid var(--border2);background:var(--white);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;font-family:var(--font);white-space:nowrap}
.filter-btn:hover{color:var(--text);border-color:var(--border3)}
.filter-btn.active{background:var(--text);border-color:var(--text);color:var(--white)}

/* ══════ SECTION HEADER ══════ */
.section-head{max-width:1200px;margin:0 auto;padding:24px 24px 12px;display:flex;align-items:baseline;justify-content:space-between}
.section-title{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.4px}
.section-count{font-size:13px;color:var(--subtle);font-weight:500}

/* ══════ PRODUCT GRID ══════ */
.product-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 24px 140px}
@media(min-width:520px){.product-grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:820px){.product-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1080px){.product-grid{grid-template-columns:repeat(5,1fr)}}

.pcard{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .3s;position:relative;opacity:0;transform:translateY(30px)}
.pcard:hover{box-shadow:var(--shadow-lg);border-color:var(--border2);transform:translateY(-6px) scale(1.02)}
.pcard:active{transform:scale(.96)}
.pcard.in-cart{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}

.pcard-img{aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pcard-img img{width:80%;height:80%;object-fit:contain;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.pcard:hover .pcard-img img{transform:scale(1.1) rotate(2deg)}
.pcard-img .emoji-placeholder{font-size:48px}

.brand-pill{position:absolute;top:10px;left:10px;font-size:10px;font-weight:600;padding:4px 10px;border-radius:100px;letter-spacing:.3px;text-transform:uppercase}
.brand-pill.ON{background:var(--teal-light);color:var(--on-color);border:1px solid var(--teal-border)}
.brand-pill.BSN{background:var(--blue-light);color:var(--bsn-color);border:1px solid rgba(37,99,235,.2)}
.brand-pill.ISOPURE{background:rgba(219,39,119,.06);color:var(--iso-color);border:1px solid rgba(219,39,119,.2)}
.stok-badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:600;padding:4px 8px;border-radius:100px}
.stok-badge.habis{background:var(--red-light);color:var(--red);border:1px solid rgba(220,38,38,.15)}
.stok-badge.terbatas{background:var(--amber-light);color:var(--amber);border:1px solid rgba(217,119,6,.15)}

.pcard-body{padding:14px}
.pcard-cat{font-size:11px;color:var(--subtle);font-weight:500;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.pcard-name{font-size:13px;font-weight:600;line-height:1.35;color:var(--text);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard-price{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px;letter-spacing:-.3px}
.pcard-price.no-price{font-size:12px;color:var(--muted);font-weight:500}
.pcard-add{width:100%;padding:9px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);border-radius:10px;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.pcard-add:hover{background:var(--text);color:var(--white);border-color:var(--text);transform:scale(1.04)}
.pcard-add:active{transform:scale(.95)}
.pcard-add.added{background:var(--teal);border-color:var(--teal);color:var(--white)}
.pcard-add:disabled{background:var(--red-light);border-color:rgba(220,38,38,.12);color:var(--red);cursor:not-allowed;transform:none}

/* ══════ ORDER TRACKING (GoFood-style) ══════ */
.tr-header{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.5px;margin-bottom:2px}
.tr-order-no{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:18px;letter-spacing:.3px}
.tr-steps{display:flex;flex-direction:column;gap:0;padding:8px 0 4px}
.tr-step{display:flex;gap:14px;position:relative;padding:0 0 22px}
.tr-step:last-child{padding-bottom:0}
.tr-step::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--border);transition:background .4s}
.tr-step:last-child::before{display:none}
.tr-step.done::before{background:var(--teal)}
.tr-step-dot{width:32px;height:32px;border-radius:50%;background:var(--bg);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .4s;font-size:14px}
.tr-step.done .tr-step-dot{background:var(--teal);border-color:var(--teal);color:var(--white)}
.tr-step.active .tr-step-dot{background:var(--white);border-color:var(--teal);color:var(--teal);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(13,148,136,.4)}50%{box-shadow:0 0 0 10px rgba(13,148,136,0)}}
.tr-step-body{flex:1;padding-top:2px}
.tr-step-label{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.tr-step.done .tr-step-label,.tr-step.active .tr-step-label{color:var(--text)}
.tr-step:not(.done):not(.active) .tr-step-label{color:var(--subtle)}
.tr-step-time{font-size:11px;color:var(--subtle);font-weight:500;margin-top:2px}
.tr-cancel{background:var(--red-light);color:var(--red);border:1px solid rgba(220,38,38,.15);padding:12px 16px;border-radius:var(--radius);font-size:13px;font-weight:600;margin-top:14px;text-align:center}
.tr-total-row{display:flex;justify-content:space-between;padding:16px 0 0;border-top:1px solid var(--border);margin-top:14px}
.tr-total-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.tr-total-val{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.tr-wa-btn{width:100%;padding:14px;background:#25D366;color:var(--white);border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);border-radius:var(--radius);margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
.tr-wa-btn:hover{opacity:.9}
.tr-wa-btn svg{width:18px;height:18px;fill:var(--white)}
.tr-share-btn{width:100%;padding:12px;background:var(--white);color:var(--text);border:1px solid var(--border2);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);border-radius:var(--radius);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.tr-share-btn:hover{background:var(--bg);border-color:var(--text)}
.tr-share-btn svg{width:16px;height:16px;stroke:var(--text)}

/* ══════ ORDER HISTORY LIST ══════ */
.oh-empty{text-align:center;padding:32px 20px;color:var(--muted);font-size:13px}
.oh-item{padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity .15s}
.oh-item:hover{opacity:.7}
.oh-item:last-child{border-bottom:none}
.oh-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.oh-no{font-size:12px;font-weight:700;color:var(--text);letter-spacing:.2px}
.oh-date{font-size:11px;color:var(--subtle);font-weight:500}
.oh-produk{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oh-bottom{display:flex;justify-content:space-between;align-items:center}
.oh-total{font-size:14px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.oh-status{font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;text-transform:uppercase;letter-spacing:.4px}
.oh-status.pending,.oh-status.proses{background:var(--amber-light);color:var(--amber);border:1px solid rgba(217,119,6,.15)}
.oh-status.selesai,.oh-status.done{background:var(--green-light);color:var(--green);border:1px solid rgba(5,150,105,.15)}
.oh-status.batal,.oh-status.dibatalkan{background:var(--red-light);color:var(--red);border:1px solid rgba(220,38,38,.12)}

/* ══════ CART FAB (Mobile) ══════ */
.cart-fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);z-index:150;display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--text);color:var(--white);padding:14px 22px;border-radius:var(--radius-lg);font-weight:600;font-size:14px;cursor:pointer;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .35s;white-space:nowrap;min-width:260px;border:none;font-family:var(--font);opacity:0;box-shadow:var(--shadow-xl)}
.cart-fab.show{transform:translateX(-50%) translateY(0);opacity:1}
.cart-fab .fab-left{display:flex;align-items:center;gap:8px}
.cart-fab svg{width:18px;height:18px;stroke:var(--white)}
.cart-fab .fab-right{display:flex;align-items:center;gap:10px}
.cart-fab .fab-total{font-size:12px;opacity:.8}
.cart-fab .fab-badge{background:var(--teal);color:var(--white);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

/* ══════ OVERLAYS / SHEETS ══════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--white);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.16,1,.3,1);position:relative}
.overlay.open .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--surface3);border-radius:3px;margin:12px auto 0}
.sheet-body{padding:20px 24px 40px}

/* ══════ PRODUCT MODAL ══════ */
.pm-img-wrap{aspect-ratio:1;background:var(--bg);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;margin-bottom:20px;overflow:hidden;border:1px solid var(--border)}
.pm-img-wrap img{width:100%;height:100%;object-fit:contain;padding:16px}
.pm-video-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--teal-light);border:1px solid var(--teal-border);border-radius:10px;color:var(--teal);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;transition:background .15s}
.pm-video-link:hover{background:rgba(13,148,136,.12)}
.pm-stok-alert{padding:10px 14px;border-radius:10px;font-size:12px;font-weight:600;margin-bottom:14px}
.pm-stok-alert.habis{background:var(--red-light);color:var(--red);border:1px solid rgba(220,38,38,.12)}
.pm-stok-alert.terbatas{background:var(--amber-light);color:var(--amber);border:1px solid rgba(217,119,6,.12)}
.pm-brand{font-size:12px;font-weight:600;letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase}
.pm-brand.ON{color:var(--on-color)}.pm-brand.BSN{color:var(--bsn-color)}.pm-brand.ISOPURE{color:var(--iso-color)}
.pm-name{font-size:24px;font-weight:800;line-height:1.15;margin-bottom:10px;letter-spacing:-.5px;color:var(--text)}
.pm-desc{font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:16px}
.pm-price{font-size:28px;font-weight:800;color:var(--text);margin-bottom:20px;letter-spacing:-.5px}
.qty-row{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.qty-btn{width:42px;height:42px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--white);color:var(--text);font-size:20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.qty-btn:hover{background:var(--bg);border-color:var(--border3)}
.qty-num{font-size:20px;font-weight:700;color:var(--text);min-width:32px;text-align:center}

.pay-detail-label{font-size:11px;color:var(--teal);font-weight:600;letter-spacing:.5px;margin-bottom:10px;text-transform:uppercase}
.pay-detail-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.pay-detail-row span{color:var(--muted)}

.pay-qr{width:100%;max-width:180px;border-radius:var(--radius);margin:0 auto;display:block;padding:4px;background:var(--white);border:1px solid var(--border)}
.checkout-btn{width:100%;margin-top:16px;padding:16px;background:var(--teal);color:var(--white);border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);border-radius:var(--radius);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}

/* ══════ TOAST ══════ */

<script>
const SB=supabase.createClient('https://wuejoxgbtvmlrriwlofk.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1ZWpveGdidHZtbHJyaXdsb2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNjY1NTQsImV4cCI6MjA5Mjg0MjU1NH0.nq0xlsuXeJNXtb8SisPQ3Ml5fXNy2vguVRJ8pNFGai0');
let products=[],cart={},activeCat='all',searchQ='',modalQty=1,selPayment='';
let salesWA='',salesName='Findest Sport',bankNama='',bankRekening='',bankAtasNama='',qrisUrl='';
let currentCustomer=null; // set jika ?c=<id> di URL
let trackChannel=null; // Supabase Realtime subscription
const fmt=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const EM={ON:'🏆',BSN:'💪',ISOPURE:'❄️'};

// Termin 30-day payment: hanya untuk customer B2B yg authed
const TERMIN_ALLOWED_TIPE=['Fitness Plus','Gym Partner','Distributor','Apotek','Gym Lain','F&B','Reseller'];
const isTerminEligible=()=>currentCustomer&&currentCustomer.tipe&&TERMIN_ALLOWED_TIPE.includes(currentCustomer.tipe);

// Status tracking steps (order matters — index = progress)
const STATUS_STEPS=[
  {key:'Pending',label:'Order Diterima',icon:'📥',aliases:['Pending','Baru']},
  {key:'Diterima',label:'Dikonfirmasi Sales',icon:'✅',aliases:['Diterima','Konfirmasi','Proses']},
  {key:'Disiapkan',label:'Sedang Disiapkan',icon:'📦',aliases:['Disiapkan','Prep']},
  {key:'Dikirim',label:'Dalam Pengiriman',icon:'🚚',aliases:['Dikirim','Antar','Otw']},
  {key:'Selesai',label:'Sudah Sampai',icon:'🎉',aliases:['Selesai','Done','Sampai','Diterima Customer']}
];
const stepIndex=(status)=>{
  if(!status)return 0;
  const s=status.toLowerCase().trim();
  for(let i=STATUS_STEPS.length-1;i>=0;i--){
    if(STATUS_STEPS[i].aliases.some(a=>a.toLowerCase()===s))return i;
  }
  return 0;
};

// ══════ URL params: ?c=<customer_id> (QR scan) atau ?o=<order_id> (tracking link) ══════
function getCustomerIdFromUrl(){
  const p=new URLSearchParams(window.location.search);
  const c=p.get('c');
  return c&&/^\d+$/.test(c)?parseInt(c):null;
}
function getOrderIdFromUrl(){
  const p=new URLSearchParams(window.location.search);
  const o=p.get('o');
  return o&&/^\d+$/.test(o)?parseInt(o):null;
}
async function loadCustomer(){
  const cid=getCustomerIdFromUrl();
  if(!cid)return;
  try{
    const{data,error}=await SB.from('customers').select('id,nama,tipe,wa,alamat').eq('id',cid).eq('status','Aktif').maybeSingle();
    if(error||!data){console.warn('[Findest] customer lookup:',error?.message||'not found');return;}
    currentCustomer=data;
    const banner=document.getElementById('custBanner');
    document.getElementById('custBannerName').textContent=data.nama;
    document.getElementById('custBannerSub').textContent=data.tipe?'· '+data.tipe:'';
    banner.classList.add('show');
  }catch(e){console.warn('[Findest] customer fetch:',e.message);}
}

function qrFail(img){img.outerHTML='<div style="font-size:12px;color:var(--muted)">QR gagal dimuat — dikirim via WhatsApp setelah order</div>';}
function convertFotoUrl(url){
  if(!url) return '';
  let m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400';
  let m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m2) return 'https://drive.google.com/thumbnail?id='+m2[1]+'&sz=w400';
  return url;
}

async function init(){
  loadCustomer(); // fire-and-forget, doesn't block products load
  // Auto-open tracker jika URL punya ?o=<order_id>
  const trackOrderId=getOrderIdFromUrl();
  if(trackOrderId){setTimeout(()=>openTracking(trackOrderId,{status:'Loading…',no_order:'ORDER #'+trackOrderId,total_nilai:0}),600);}
  try{
    const[cfg,prods]=await Promise.all([
      SB.from('config').select('key,value'),
      SB.from('products').select('id,nama,brand,kategori,harga,foto_url,deskripsi,status,video_url,stok').eq('status','Aktif').order('brand').order('nama')
    ]);
    if(cfg.data)cfg.data.forEach(r=>{
      if(r.key==='catalog_wa'){let wa=(r.value||'').replace(/[\s\-]/g,'');if(wa.startsWith('+62'))wa=wa.slice(1);else if(wa.startsWith('08'))wa='62'+wa.slice(1);else if(wa.startsWith('8')&&!wa.startsWith('62'))wa='62'+wa;salesWA=wa;}
      if(r.key==='catalog_sales_name')salesName=r.value||'Findest Sport';
      if(r.key==='bank_nama')bankNama=r.value||'';
      if(r.key==='bank_rekening')bankRekening=r.value||'';
      if(r.key==='bank_atas_nama')bankAtasNama=r.value||'';
      if(r.key==='qris_url')qrisUrl=r.value||'';
    });
    products=prods.data||[];
    document.getElementById('sn1').textContent=products.length;
    render();
  }catch(e){
    console.error(e);
    document.getElementById('productGrid').innerHTML='<div class="empty-state"><div class="empty-icon">&#9888;</div><p>Gagal memuat — cek koneksi</p></div>';
  }
}

function getFiltered(){
  return products.filter(p=>{
    const mC=activeCat==='all'||p.brand===activeCat||p.kategori===activeCat;
    const mQ=!searchQ||p.nama.toLowerCase().includes(searchQ)||p.brand.toLowerCase().includes(searchQ)||(p.kategori||'').toLowerCase().includes(searchQ);
    return mC&&mQ;
  });
}

function render(){
  const list=getFiltered();
  document.getElementById('secLabel').textContent=activeCat==='all'?'All Products':activeCat;
  document.getElementById('secCount').textContent=list.length+' produk';
  const grid=document.getElementById('productGrid');
  if(!list.length){grid.innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><p>Produk tidak ditemukan</p></div>';return;}
  grid.innerHTML=list.map(p=>{
    const stok=p.stok!=null?parseInt(p.stok):null;
    const habis=stok===0;
    const terbatas=stok!=null&&stok>0&&stok<=10;
    const inCart=!!cart[p.id];
    const em=EM[p.brand]||'📦';
    return `<div class="pcard${inCart?' in-cart':''}" onclick="openProd(${p.id})">
      <div class="pcard-img">
        ${p.foto_url?`<img src="${convertFotoUrl(p.foto_url)}" onerror="this.outerHTML='<span class=emoji-placeholder>${em}</span>'">`:`<span class="emoji-placeholder">${em}</span>`}
        <div class="brand-pill ${p.brand}">${p.brand}</div>
        ${habis?'<div class="stok-badge habis">Habis</div>':terbatas?`<div class="stok-badge terbatas">Sisa ${stok}</div>`:''}
      </div>
      <div class="pcard-body">
        <div class="pcard-cat">${p.kategori||''}</div>
        <div class="pcard-name">${p.nama}</div>
        <div class="pcard-price${p.harga?'':' no-price'}">${p.harga?fmt(p.harga):'Hubungi Sales'}</div>
        <button class="pcard-add${inCart?' added':''}" ${habis?'disabled':''} onclick="event.stopPropagation();quickAdd(${p.id})">
          ${habis?'Habis':inCart?'&#10003; Added':'+ Add'}
        </button>
      </div>
    </div>`;
  }).join('');
}

function setCat(cat,btn){activeCat=cat;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function filterProducts(){searchQ=document.getElementById('searchInput').value.trim().toLowerCase();document.getElementById('clearBtn').style.display=searchQ?'block':'none';render();}
function clearSearch(){searchQ='';document.getElementById('searchInput').value='';document.getElementById('clearBtn').style.display='none';render();}

function quickAdd(id){
  const p=products.find(x=>x.id===id);
  if(!p||p.stok===0)return;
  cart[id]=cart[id]?{product:p,qty:cart[id].qty+1}:{product:p,qty:1};
  updateFab();render();
  showToast('+ '+p.nama.substring(0,25));
}

function changeCartQty(id,d){
  if(!cart[id])return;
  cart[id].qty+=d;
  if(cart[id].qty<=0)delete cart[id];
  updateFab();openCart();
}

function updateFab(){
  const items=Object.values(cart);
  const total=items.reduce((s,c)=>s+(c.product.harga||0)*c.qty,0);
  const count=items.reduce((s,c)=>s+c.qty,0);

async function sendOrder(){
  const name=document.getElementById('buyerName')?.value.trim();
  const phone=document.getElementById('buyerPhone')?.value.trim();
  const gym=document.getElementById('buyerGym')?.value.trim();
  const address=document.getElementById('buyerAddress')?.value.trim();
  const note=document.getElementById('buyerNote')?.value.trim();
  if(!name){showToast('Masukkan nama kamu');return;}
  if(!phone){showToast('Masukkan nomor WA');return;}
  if(!selPayment){showToast('Pilih metode pembayaran');return;}
  const items=Object.values(cart).filter(c=>c.qty>0);
  if(!items.length){showToast('Cart kosong');return;}
  const total=items.reduce((s,c)=>s+(c.product.harga||0)*c.qty,0);
  const itemsText=items.map(c=>`  • *${c.product.brand} ${c.product.nama}*\n    ${c.qty} unit × ${fmt(c.product.harga||0)} = *${fmt((c.product.harga||0)*c.qty)}*`).join('\n');
  const msg=`🏋️ *PESANAN BARU — FINDEST SPORT*\n\n👤 *Nama:* ${name}\n📱 *WA:* ${phone}${gym?'\n🏪 *Gym:* '+gym:''}${address?'\n📍 *Alamat:* '+address:''}\n💳 *Pembayaran:* ${selPayment}\n\n━━━━━━━━━━━━━━━━\n🛒 *DETAIL PESANAN:*\n${itemsText}\n━━━━━━━━━━━━━━━━\n💰 *TOTAL: ${fmt(total)}*${note?'\n\n📝 *Catatan:* '+note:''}\n\n_via Findest Sport Digital Catalog_`;
  if(salesWA){
    window.open('https://wa.me/'+salesWA+'?text='+encodeURIComponent(msg),'_blank');
  }else{
    try{await navigator.clipboard.writeText(msg);showToast('Order di-copy! (No WA belum diset)');}
    catch(e){alert(msg);}
    return;
  }
  let insertedOrder=null;
  try{
    const produkText=items.map(c=>`${c.product.brand} ${c.product.nama} x${c.qty}`).join(', ');
    const produkJson=items.map(c=>({
      product_id:c.product.id,
      nama:c.product.nama,
      brand:c.product.brand,
      qty:c.qty,
      harga:c.product.harga||0,
      subtotal:(c.product.harga||0)*c.qty
    }));
    const orderRow={
      customer_nama:name,
      produk:produkText,
      produk_json:produkJson,
      total_nilai:total,
      status:'Pending',
      pembayaran:selPayment,
      channel_sistem:'Findest Sport Catalog',
      channel_tipe:currentCustomer?(currentCustomer.tipe||'Customer'):'Public',
      catatan:`WA: ${phone}${gym?' | Gym: '+gym:''}${address?' | Alamat: '+address:''}${selPayment?' | Bayar: '+selPayment:''}${note?' | Note: '+note:''}${currentCustomer?' | customer_id:'+currentCustomer.id:''}`
    };
    if(currentCustomer)orderRow.customer_id=currentCustomer.id;
    if(selPayment==='Termin 30 Hari'){
      orderRow.credit_days=30;
      const due=new Date();due.setDate(due.getDate()+30);
      orderRow.due_date=due.toISOString().slice(0,10);
    }
    const{data,error}=await SB.from('orders').insert([orderRow]).select('id,no_order,status,total_nilai').single();
    if(error)throw error;
    insertedOrder=data;
  }catch(e){console.log('Order save:',e);}
  cart={};updateFab();closeOverlay('cartModal');render();
  showToast('Order berhasil dikirim!');
  // Open tracking modal kalo order sukses saved
  if(insertedOrder&&insertedOrder.id){
    // Persist trackable URL biar refresh/share tetap keep tracker
    try{
      const url=new URL(window.location);
      url.searchParams.set('o',insertedOrder.id);
      history.replaceState(null,'',url);
    }catch(e){}
    setTimeout(()=>openTracking(insertedOrder.id,{status:insertedOrder.status,no_order:insertedOrder.no_order,total_nilai:insertedOrder.total_nilai,pembayaran:selPayment}),400);
  }
}

async function shareTrackLink(url,orderId){
  try{
    // Native share API (best on mobile)
    if(navigator.share){
      await navigator.share({title:'Lacak Pesanan Findest Sport',text:'Cek status pesanan lo di sini:',url});
      showToast('Link di-share');
      return;
    }
    // Fallback: clipboard
    await navigator.clipboard.writeText(url);
    showToast('Link tracker di-copy!');
  }catch(e){
    // Last resort: prompt so user can select+copy manually
    prompt('Copy link tracker:',url);
  }
}

function openTracking(orderId,initialData){
  if(!orderId)return;
  const initial=initialData||{status:'Pending',no_order:'ORDER #'+orderId,total_nilai:0,pembayaran:''};
  initial.id=orderId;
  renderTracker(initial);
  openOverlay('trackModal');
  // Cleanup existing subscription
  if(trackChannel){SB.removeChannel(trackChannel);trackChannel=null;}
  // Subscribe to realtime updates for this order
  try{
    trackChannel=SB.channel(`order-${orderId}`)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders',filter:`id=eq.${orderId}`},payload=>{
        const merged={...initial,...payload.new};
        renderTracker(merged);
        showToast('Status updated: '+(payload.new.status||'—'));
      })
      .subscribe();
  }catch(e){console.warn('[Findest] realtime subscribe:',e.message);}
  // Also fetch fresh (in case status changed while modal was closed)
  SB.from('orders').select('id,no_order,status,total_nilai,pembayaran,created_at').eq('id',orderId).maybeSingle().then(({data})=>{
    if(data)renderTracker({...initial,...data});
  });
}

    document.querySelectorAll('.stat-num').forEach(el => {
      const target = parseInt(el.textContent);
      if (isNaN(target)) return;
      gsap.from(el, {
        textContent: 0, duration: 1.5, ease: 'power2.out', snap: { textContent: 1 },
        onUpdate: function() { el.textContent = Math.round(parseFloat(el.textContent)); }
      });
    });
  }
});
gsap.set('.stat-item', { y: 20 });

// ══════ GSAP: Section header ══════
gsap.to('.section-head', {
  opacity: 1, y: 0, duration: 0.6, ease: 'power2.out',
  scrollTrigger: { trigger: '.section-head', start: 'top 90%' }
});
gsap.set('.section-head', { y: 15 });

// ══════ GSAP: Navbar scroll ══════
ScrollTrigger.create({
  start: 10,
  onUpdate: (self) => {
    document.querySelector('.navbar').classList.toggle('scrolled', self.scroll() > 10);
  }
});

// ══════ GSAP: Product card scroll reveal ══════
function animateCards() {
  const cards = document.querySelectorAll('.pcard');
  if (!cards.length) return;
  const cols = window.innerWidth < 520 ? 2 : window.innerWidth < 820 ? 3 : window.innerWidth < 1080 ? 4 : 5;

  ScrollTrigger.batch(cards, {
    onEnter: (batch) => {
      batch.forEach((card, i) => {
        const idx = Array.from(card.parentNode.children).indexOf(card);
        const colIdx = idx % cols;
        gsap.to(card, {
          opacity: 1, y: 0, scale: 1,
          duration: 0.6,
          delay: colIdx * 0.08,
          ease: 'back.out(1.4)',
          overwrite: true
        });
      });
    },
    start: 'top 92%'
  });
}

// ══════ GSAP: Override render ══════
const _origRender = render;
render = function() {
  _origRender();
  requestAnimationFrame(() => {
    ScrollTrigger.refresh();
    animateCards();
  });
};

// ══════ GSAP: Cart badge bounce ══════
const _origUpdateFab = updateFab;
updateFab = function() {
  _origUpdateFab();
  const badge = document.getElementById('navBadge');
  gsap.fromTo(badge, { scale: 1.5 }, { scale: 1, duration: 0.5, ease: 'elastic.out(1, 0.4)' });
  const fab = document.getElementById('cartFab');
  if (fab.classList.contains('show')) {
    gsap.fromTo(fab, { scale: 0.95 }, { scale: 1, duration: 0.4, ease: 'elastic.out(1, 0.5)' });
  }
};

// ══════ GSAP: Category filter transition ══════
const _origSetCat = setCat;
setCat = function(cat, btn) {
  const grid = document.getElementById('productGrid');
  gsap.to(grid, {
    opacity: 0, y: 10, duration: 0.2, ease: 'power2.in',
    onComplete: () => {
      _origSetCat(cat, btn);
      gsap.fromTo(grid, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' });
    }
  });
};

// ══════ GSAP: Toast animation ══════
const _origToast = showToast;
showToast = function(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  gsap.killTweensOf(t);
  gsap.fromTo(t,
    { opacity: 0, y: 20, scale: 0.9 },
    { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: 'back.out(1.7)',
      onComplete: () => {
        gsap.to(t, { opacity: 0, y: -10, delay: 2, duration: 0.3, ease: 'power2.in' });
      }
    }
  );
};

// ══════ GSAP: Modal open/close ══════
const _origOpenOverlay = openOverlay;
openOverlay = function(id) {
  const overlay = document.getElementById(id);
  const sheet = overlay.querySelector('.sheet');
  overlay.classList.add('open');
  gsap.fromTo(sheet,
    { y: '100%', scale: 0.95 },
    { y: '0%', scale: 1, duration: 0.5, ease: 'power3.out' }
  );
};

init();

// PWA — register service worker
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => console.warn('[PWA] SW register failed:', err));
  });
}
</script>
</body>
</html>
